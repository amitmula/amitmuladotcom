<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amit Mula // Software Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Use a 'techie' monospaced font */
        body, html {
            font-family: 'Roboto Mono', monospace;
            background-color: #0D1117; /* GitHub dark bg */
            color: #C9D1D9; /* GitHub dark text */
            line-height: 1.6;
        }

        /* Custom scrollbar for the terminal body */
        #terminal-body::-webkit-scrollbar {
            width: 8px;
        }
        #terminal-body::-webkit-scrollbar-track {
            background: #161B22; /* Darker track */
        }
        #terminal-body::-webkit-scrollbar-thumb {
            background-color: #30363D; /* Scrollbar color */
            border-radius: 4px;
        }
        
        /* Command links styling */
        .command {
            color: #58A6FF; /* Blue for commands */
            text-decoration: underline;
            cursor: pointer;
            font-weight: 500;
        }
        .command:hover {
            color: #79C0FF; /* Lighter blue on hover */
        }

        /* Prompt styling */
        .prompt {
            color: #3FB950; /* Green for user/host */
        }
        .path {
            color: #A371F7; /* Purple for path */
        }

        /* Make terminal body clickable to focus input */
        #terminal-body {
            cursor: text;
        }

        /* Input styling */
        #command-input {
            /* Make it blend in perfectly */
            background-color: transparent;
            border: none;
            outline: none;
            box-shadow: none;
            padding: 0; /* Remove default padding */
            color: #C9D1D9; /* Match body text */
            font-family: 'Roboto Mono', monospace; /* Match body font */
            font-size: inherit; /* Match parent font size */
        }

        /* Style the input's caret (cursor) */
        #command-input:focus {
            outline: none;
            box-shadow: none;
            caret-color: #58A6FF; /* Set the caret color */
        }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4 sm:p-8">

    <!-- Terminal Window -->
    <div class="w-full max-w-5xl h-[80vh] min-h-[500px] bg-[#161B22] rounded-lg shadow-2xl flex flex-col border border-[#30363D]">
        
        <!-- Terminal Title Bar -->
        <div class="flex items-center p-3 bg-[#21262D] rounded-t-lg border-b border-[#30363D]">
            <!-- Mac-style buttons -->
            <div class="flex space-x-2">
                <div class="w-3 h-3 bg-[#FF5F56] rounded-full"></div>
                <div class="w-3 h-3 bg-[#FFBD2E] rounded-full"></div>
                <div class="w-3 h-3 bg-[#27C93F] rounded-full"></div>
            </div>
            <div class="flex-grow text-center text-sm text-gray-400">
                guest@amitmula.com -- /bin/bash
            </div>
            <div class="w-16"></div> <!-- Spacer -->
        </div>

        <!-- Terminal Body -->
        <div id="terminal-body" class="flex-grow p-4 overflow-y-auto text-sm sm:text-base flex flex-col">
            <div id="output-container" class="flex-grow">
                <!-- Initial output will be dynamically generated by JS -->
            </div>
            
            <!-- Input Prompt Area (Fixed for Alignment) -->
            <div class="flex items-baseline mt-2"> 
                <!-- Prompt parts are kept simple and inline -->
                <span class="prompt">guest@amitmula.com</span>
                <span class="text-gray-400">:</span>
                <span class="path">~</span>
                <span class="text-gray-400 mr-2">$</span> <!-- Added mr-2 for spacing before input -->
                
                <input
                    type="text"
                    id="command-input"
                    class="flex-1"
                />
            </div>
        </div>
    </div>

    <script>
        const outputContainer = document.getElementById('output-container');
        const commandInput = document.getElementById('command-input');
        const terminalBody = document.getElementById('terminal-body');

        // --- Event Listeners ---
        commandInput.addEventListener('keydown', handleInput);
        terminalBody.addEventListener('click', () => commandInput.focus());

        // --- Core Input Handler ---
        function handleInput(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const prompt = commandInput.value.trim();
                commandInput.value = ''; // Clear input immediately

                if (prompt) {
                    // Display the prompt the user typed
                    appendUserPrompt(prompt);
                    // Call the AI with the prompt
                    callAI(prompt);
                } else {
                    // If the user presses enter on an empty line, just show the prompt
                    appendUserPrompt(prompt);
                }
                
                scrollToBottom();
            }
        }
        
        function appendUserPrompt(prompt) {
            const promptLine = `
                <div class="flex items-baseline">
                    <span class="prompt">guest@amitmula.com</span>
                    <span class="text-gray-400">:</span>
                    <span class="path">~</span>
                    <span class="text-gray-400 mr-2">$</span>
                    <span class="ml-0">${escapeHtml(prompt)}</span>
                </div>
            `;
            outputContainer.innerHTML += promptLine;
        }

        // --- AI Backend Function ---
        async function callAI(prompt) {
            // Create a container for the AI's streaming response
            const responseContainer = document.createElement('div');
            responseContainer.classList.add('mb-4', 'text-gray-300');
            outputContainer.appendChild(responseContainer);
            
            // Initial placeholder
            responseContainer.innerHTML = '<p>🧠 Thinking...</p>';
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }) 
                });

                if (!response.ok || !response.body) {
                    const errorText = await response.text();
                    responseContainer.innerHTML = `<p class="text-red-400">Error: ${escapeHtml(errorText) || response.statusText}</p>`;
                    return;
                }
                
                responseContainer.innerHTML = ''; // Clear the "Thinking..." message

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    
                    let boundary = buffer.indexOf('\n');
                    while (boundary !== -1) {
                        const jsonStr = buffer.substring(0, boundary);
                        buffer = buffer.substring(boundary + 1);
                        
                        if (jsonStr) {
                            try {
                                const chunk = JSON.parse(jsonStr);
                                if (chunk.response) {
                                    const textNode = document.createTextNode(chunk.response);
                                    responseContainer.appendChild(textNode);
                                    scrollToBottom();
                                }
                                if (chunk.error) {
                                    const errorNode = document.createElement('p');
                                    errorNode.className = 'text-red-400';
                                    errorNode.innerText = chunk.error;
                                    responseContainer.appendChild(errorNode);
                                }
                            } catch (e) {
                                console.error('Failed to parse JSON chunk:', jsonStr);
                            }
                        }
                        boundary = buffer.indexOf('\n');
                    }
                }
            } catch (error) {
                console.error('Error calling AI service:', error);
                responseContainer.innerHTML = '<p class="text-red-400">Error: Could not connect to the AI service. Is it running?</p>';
            } finally {
                scrollToBottom();
            }
        }
        
        function showWelcomeMessage() {
            outputContainer.innerHTML = `
                <div class="mb-4">
                    <div class="text-xl sm:text-2xl font-bold text-green-400">Welcome to Amit Mula's Interactive website</div>
                    <p class="mt-2">Hello! I'm Gigo, AI assistant for Amit's website.</p>
                    <p>I can help you learn more about Amit</p>
                    <br>
                    <p>Just type your question below and press Enter!</p>
                </div>
            `;
        }
        
        function scrollToBottom() {
            terminalBody.scrollTop = terminalBody.scrollHeight;
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // --- On Page Load ---
        window.onload = () => {
            showWelcomeMessage();
            commandInput.focus();
        };
    </script>

</body>
</html>
