server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files and the main index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for the backend API
    location /api/ {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=30s;
        
        # Set the backend service hostname as a variable.
        # This forces Nginx to resolve the DNS at request-time instead of start-time.
        set $backend_service "backend";
        proxy_pass http://$backend_service:3000;

        # Important for streaming responses from the AI
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Clear the connection header to allow keep-alive
        proxy_set_header Cache-Control no-cache;
        proxy_buffering off; # Disable buffering for streaming

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for slow AI responses
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
