services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: amit_mula_frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: amit_mula_backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"